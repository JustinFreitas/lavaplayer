name: Build Natives

# Rebuilds the native connector libraries from source on each host platform and
# uploads them as artifacts. These binaries are otherwise committed by hand under
# natives-publish/src/main/resources/natives/<identifier>/, so this workflow is
# the reproducible way to refresh them.
#
# Only the host-native targets the build script supports are covered here
# (win-x86-64, win-x86, linux-x86-64, linux-aarch64, darwin). The remaining
# cross-compiled variants (linux 32-bit arm/x86 and musl targets) are not
# produced by natives/natives.gradle and would need dedicated cross-compilation.

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Open a pull request with the freshly built native binaries'
        type: boolean
        default: false
  push:
    branches: [ '**' ]
    paths:
      - 'natives/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/natives.yml'

jobs:
  build:
    name: ${{ matrix.identifier }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            identifier: win-x86-64
            library: connector.dll
          - os: ubuntu-22.04
            identifier: linux-x86-64
            library: libconnector.so
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - os: ubuntu-24.04-arm
            identifier: linux-aarch64
            library: libconnector.so
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
          - os: macos-15-intel
            identifier: darwin
            library: libconnector.dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build natives (Windows/macOS)
        if: runner.os != 'Linux'
        # The bundled CMakeLists declare cmake_minimum_required(VERSION 3.15);
        # CMAKE_POLICY_VERSION_MINIMUM keeps CMake 4 runners from rejecting any
        # older minimums pulled in from downloaded codec sources.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: ./gradlew :natives:compileNatives --no-daemon

      - name: Build natives (Linux via Docker manylinux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v $JAVA_HOME:/jdk \
            -w /workspace \
            -e CMAKE_POLICY_VERSION_MINIMUM='3.5' \
            -e JAVA_HOME=/jdk \
            ${{ matrix.manylinux_image }} \
            bash -c 'export PATH="/jdk/bin:$PATH" && ./gradlew :natives:compileNatives --no-daemon'

      - name: Verify connector was produced
        shell: bash
        run: |
          target="natives-publish/src/main/resources/natives/${{ matrix.identifier }}/${{ matrix.library }}"
          if [ ! -f "$target" ]; then
            echo "Expected native library not found: $target" >&2
            exit 1
          fi
          echo "Built $target ($(wc -c < "$target") bytes)"
          if [ "${{ matrix.identifier }}" = "darwin" ]; then
            file "$target"
            lipo -info "$target"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            file "$target"
          fi

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: connector-${{ matrix.identifier }}
          path: natives-publish/src/main/resources/natives/${{ matrix.identifier }}/
          if-no-files-found: error

      - name: Upload native library (win-x86)
        if: matrix.identifier == 'win-x86-64'
        uses: actions/upload-artifact@v7
        with:
          name: connector-win-x86
          path: natives-publish/src/main/resources/natives/win-x86/
          if-no-files-found: error

  open-pr:
    name: Open PR with refreshed natives
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.create_pr == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: connector-*
          path: downloaded-natives

      - name: Copy natives into natives-publish
        run: |
          for dir in downloaded-natives/connector-*; do
            target="${dir#downloaded-natives/connector-}"
            mkdir -p "natives-publish/src/main/resources/natives/${target}"
            cp -f "${dir}"/* "natives-publish/src/main/resources/natives/${target}/"
          done
          rm -rf downloaded-natives
          git add -f natives-publish/src/main/resources/natives/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(natives): refresh prebuilt native binaries'
          branch: 'chore/refresh-natives'
          delete-branch: true
          title: 'chore(natives): refresh prebuilt native binaries'
          body: 'Automatically refreshed `win-x86-64`, `win-x86`, `linux-x86-64`, `linux-aarch64`, and `darwin` native binaries via `Build Natives` workflow.'
