def verifyFileSha256(File file, String expectedHash) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.eachByte(4096) { buffer, length ->
        digest.update(buffer, 0, length)
    }
    def actualHash = digest.digest().encodeHex().toString()
    if (!actualHash.equalsIgnoreCase(expectedHash)) {
        throw new GradleException("SHA-256 verification failed for ${file.name}. Expected: ${expectedHash}, Actual: ${actualHash}")
    }
}

def downloadFromMirrors(List<String> urls, Object destPath) {
    Exception lastError = null
    for (String candidateUrl : urls) {
        try {
            download.run {
                src candidateUrl
                dest destPath
                overwrite true
            }
            return
        } catch (Exception e) {
            logger.warn("Download failed from ${candidateUrl} (${e.message}); trying fallback mirror if available.")
            lastError = e
        }
    }
    throw new GradleException("Failed to download archive from all mirrors: ${urls}", lastError)
}

tasks.register('load') {
    doLast {
        def sampleRateMarker = file("$projectDir/samplerate/src/.version")
        if (!file("$projectDir/samplerate/src").exists() || !sampleRateMarker.exists() || sampleRateMarker.text.trim() != sampleRateVersion) {
            file("$projectDir/samplerate/src").deleteDir()
            def downloadPath = "${layout.buildDirectory.get()}/tmp/libsamplerate-${sampleRateVersion}.tar.gz"
            def unpackPath = "${layout.buildDirectory.get()}/tmp"

            downloadFromMirrors([
                "https://github.com/libsndfile/libsamplerate/archive/refs/tags/${sampleRateVersion}.tar.gz"
            ], downloadPath)

            verifyFileSha256(file(downloadPath), sampleRateSha256)

            copy {
                from tarTree(resources.gzip(downloadPath))
                into unpackPath
            }

            copy {
                from "$unpackPath/libsamplerate-${sampleRateVersion}/src"
                into "$projectDir/samplerate/src"
            }

            // libsamplerate 0.2.x ships the public header under include/ rather
            // than src/; place it alongside the sources so the build finds it.
            copy {
                from "$unpackPath/libsamplerate-${sampleRateVersion}/include"
                into "$projectDir/samplerate/src"
            }

            sampleRateMarker.text = sampleRateVersion
        }

        def fdkMarker = file("$projectDir/fdk-aac/.version")
        def fdkUnpacked = file("$projectDir/fdk-aac/cpp/libAACdec").exists() || file("$projectDir/fdk-aac/libAACdec").exists()
        if (!fdkUnpacked || !fdkMarker.exists() || fdkMarker.text.trim() != fdkAacVersion) {
            file("$projectDir/fdk-aac").listFiles()?.each { entry ->
                if (entry.name != "CMakeLists.txt") {
                    if (entry.isDirectory()) {
                        entry.deleteDir()
                    } else {
                        entry.delete()
                    }
                }
            }

            def downloadPath = "${layout.buildDirectory.get()}/tmp/fdk-aac-v${fdkAacVersion}.zip"
            def unpackPath = "${layout.buildDirectory.get()}"

            downloadFromMirrors([
                "https://github.com/mstorsjo/fdk-aac/archive/refs/tags/v${fdkAacVersion}.zip"
            ], downloadPath)

            verifyFileSha256(file(downloadPath), fdkAacSha256)

            copy {
                from zipTree(file(downloadPath))
                into unpackPath
            }

            // Copy the upstream sources but keep our custom CMakeLists.txt, which
            // builds fdk-aac as a static /MT library consistent with the other
            // codecs (the upstream CMakeLists defaults to a shared DLL build).
            copy {
                from "$unpackPath/fdk-aac-${fdkAacVersion}"
                into "$projectDir/fdk-aac"
                exclude "CMakeLists.txt"
            }

            fdkMarker.text = fdkAacVersion
        }

        if (!file("$projectDir/vorbis/libogg-${oggVersion}").exists()) {
            def downloadPath = "${layout.buildDirectory.get()}/tmp/libogg-${oggVersion}.zip"

            downloadFromMirrors([
                "https://github.com/xiph/ogg/releases/download/v${oggVersion}/libogg-${oggVersion}.zip",
                "https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-${oggVersion}.zip"
            ], downloadPath)

            verifyFileSha256(file(downloadPath), oggSha256)

            copy {
                from zipTree(file(downloadPath))
                into "$projectDir/vorbis"
            }
        }

        if (!file("$projectDir/vorbis/libvorbis-${vorbisVersion}").exists()) {
            def downloadPath = "${layout.buildDirectory.get()}/tmp/libvorbis-${vorbisVersion}.zip"

            downloadFromMirrors([
                "https://github.com/xiph/vorbis/releases/download/v${vorbisVersion}/libvorbis-${vorbisVersion}.zip",
                "https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-${vorbisVersion}.zip"
            ], downloadPath)

            verifyFileSha256(file(downloadPath), vorbisSha256)

            copy {
                from zipTree(file(downloadPath))
                into "$projectDir/vorbis"
            }
        }

        if (!file("$projectDir/opus/opus-${opusVersion}").exists()) {
            def downloadPath = "${layout.buildDirectory.get()}/tmp/opus-${opusVersion}.tar.gz"

            downloadFromMirrors([
                "https://github.com/xiph/opus/releases/download/v${opusVersion}/opus-${opusVersion}.tar.gz",
                "https://distfiles.macports.org/libopus/opus-${opusVersion}.tar.gz",
                "https://ftp.osuosl.org/pub/xiph/releases/opus/opus-${opusVersion}.tar.gz"
            ], downloadPath)

            verifyFileSha256(file(downloadPath), opusSha256)

            copy {
                from tarTree(file(downloadPath))
                into "$projectDir/opus"
            }
        }

        if (!Os.isFamily(Os.FAMILY_WINDOWS) && !file("$projectDir/mp3/mpg123-${mpg123Version}").exists()) {
            def downloadPath = "${layout.buildDirectory.get()}/tmp/mpg123-${mpg123Version}.tar.bz2"

            downloadFromMirrors([
                "https://www.mpg123.de/download/mpg123-${mpg123Version}.tar.bz2"
            ], downloadPath)

            verifyFileSha256(file(downloadPath), mpg123Sha256)

            copy {
                from tarTree(file(downloadPath))
                into "$projectDir/mp3"
            }
        }
    }
}

ext.msBuildPath = null

def getMsBuildLocation() {
    if (ext.msBuildPath == null) {
        def vswhere = new File(System.getenv("ProgramFiles(x86)"),
            "Microsoft Visual Studio/Installer/vswhere.exe")

        def outStream = new StringBuilder()
        def errStream = new StringBuilder()
        def process = [vswhere.absolutePath, "-products", "*", "-latest", "-find",
            "MSBuild/**/Bin/MSBuild.exe"].execute()
        process.consumeProcessOutput(outStream, errStream)
        process.waitFor()

        def msbuild = outStream.toString().readLines().find { !it.trim().isEmpty() }?.trim()
        if (msbuild == null || !new File(msbuild).exists()) {
            throw new IllegalStateException("Could not locate MSBuild.exe via vswhere: $errStream")
        }

        ext.msBuildPath = msbuild
    }

    return ext.msBuildPath
}

def findVcTool(name) {
    def vswhere = new File(System.getenv("ProgramFiles(x86)"),
        "Microsoft Visual Studio/Installer/vswhere.exe")

    def outStream = new StringBuilder()
    def errStream = new StringBuilder()
    def process = [vswhere.absolutePath, "-products", "*", "-latest", "-find",
        "VC/Tools/MSVC/**/bin/Hostx64/x64/${name}"].execute()
    process.consumeProcessOutput(outStream, errStream)
    process.waitFor()

    def tool = outStream.toString().readLines().find { !it.trim().isEmpty() }?.trim()
    if (tool == null || !new File(tool).exists()) {
        throw new IllegalStateException("Could not locate ${name} via vswhere: $errStream")
    }

    return tool
}

// mpg123 is shipped as a prebuilt DLL on Windows rather than compiled from
// source; synthesize the import library the connector links against from that
// DLL's export table so libs/<bits>/mpg123.lib is always present for the link.
def generateMpg123ImportLibOnWindows(String bitsDir = "64", String targetIdentifier = "win-x86-64", String machineArch = "x64") {
    def base = file("$projectDir/libs/${bitsDir}")
    base.mkdirs()

    def dll = file("${project(':natives-publish').projectDir}" +
        "/src/main/resources/natives/${targetIdentifier}/libmpg123-0.dll")
    if (!dll.exists()) {
        throw new IllegalStateException("Prebuilt mpg123 DLL not found: $dll")
    }

    def dumpbin = findVcTool("dumpbin.exe")
    def lib = findVcTool("lib.exe")

    def exports = new StringBuilder()
    def dumpProcess = [dumpbin, "/exports", dll.absolutePath].execute()
    dumpProcess.consumeProcessOutput(exports, new StringBuilder())
    dumpProcess.waitFor()

    def names = exports.toString().readLines().findResults { line ->
        def matcher = line =~ /^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)/
        matcher ? matcher[0][1] : null
    }
    if (names.isEmpty()) {
        throw new IllegalStateException("No exports found in $dll")
    }

    def defFile = new File(base, "mpg123.def")
    defFile.text = (["EXPORTS"] + names).join(System.lineSeparator())

    def libProcess = [lib, "/def:${defFile.absolutePath}", "/machine:${machineArch}",
        "/name:libmpg123-0.dll", "/out:${new File(base, "mpg123.lib").absolutePath}"].
        execute()
    waitForAndCheckSuccess(libProcess, "mpg123 import lib (${targetIdentifier})")
}

static def waitForAndCheckSuccess(process, name) {
    process.waitForProcessOutput(System.out as Appendable, System.err)

    if (process.exitValue() != 0) {
        throw new IllegalStateException("${name} failed.")
    }
}

// Override the autotools regeneration programs with no-ops so the pre-generated
// files in a release tarball are never rebuilt. This avoids depending on the
// exact aclocal/automake version the tarball was produced with, which the host
// rarely matches (and which may not even be installed).
def autotoolsNoOpOverrides() {
    return ["ACLOCAL=true", "AUTOMAKE=true", "AUTOCONF=true",
            "AUTOHEADER=true", "AUTORECONF=true", "MAKEINFO=true"]
}

// The x86-64 --with-cpu tuning forces x86 assembly, which does not assemble on
// Apple Silicon; let configure autodetect the CPU there (arm64 macOS runners).
def withCpuArgs(cpu) {
    return Os.isFamily(Os.FAMILY_MAC) ? [] : ["--with-cpu=${cpu}".toString()]
}

def buildMpg123OnLinux(force) {
    def versionMarker = file("${projectDir}/libs/64/.mpg123-version")
    def present = file("${projectDir}/libs/64/libmpg123.a").exists() &&
        versionMarker.exists() && versionMarker.text.trim() == mpg123Version

    if (force || !present) {
        def mpgDir = file("$projectDir/mp3/mpg123-${mpg123Version}")
        def overrides = autotoolsNoOpOverrides()

        def flags = "-fPIC -O3 -fdata-sections -ffunction-sections"
        def process = (['sh', './configure', '--enable-static'] + withCpuArgs('x86-64') + ['--with-pic', "CFLAGS=$flags", "CXXFLAGS=$flags"] + overrides).
            execute(null as String[], mpgDir)

        waitForAndCheckSuccess(process, "Mpg123 ./configure")

        process = (["make", "clean"] + overrides).execute(null as String[], mpgDir)
        waitForAndCheckSuccess(process, "make clean")

        process = (["make"] + overrides).execute(null as String[], mpgDir)
        waitForAndCheckSuccess(process, "make")

        copy {
            from "$projectDir/mp3/mpg123-${mpg123Version}/src/libmpg123/.libs/libmpg123.a"
            into "$projectDir/libs/64"
        }

        versionMarker.parentFile.mkdirs()
        versionMarker.text = mpg123Version
    }
}

def buildMpg123MacSlice(String archFlag, String hostTriple, String cpuType, String outDirName, boolean force) {
    def outDir = file("${projectDir}/libs/${outDirName}")
    def versionMarker = new File(outDir, ".mpg123-version")
    def present = new File(outDir, "libmpg123.a").exists() &&
        versionMarker.exists() && versionMarker.text.trim() == mpg123Version

    if (force || !present) {
        def mpgDir = file("$projectDir/mp3/mpg123-${mpg123Version}")
        def overrides = autotoolsNoOpOverrides()
        def buildTriple = System.getProperty("os.arch") == "aarch64" ? "aarch64-apple-darwin" : "x86_64-apple-darwin"
        def cflags = "-arch ${archFlag} -fPIC -O3 -fdata-sections -ffunction-sections"

        def process = ([
            'sh', './configure',
            '--enable-static',
            '--disable-shared',
            "--build=${buildTriple}".toString(),
            "--host=${hostTriple}".toString(),
            "--with-cpu=${cpuType}".toString(),
            '--with-pic',
            "CFLAGS=${cflags}".toString(),
            "CXXFLAGS=${cflags}".toString(),
            "CCASFLAGS=-arch ${archFlag}".toString(),
            "LDFLAGS=-arch ${archFlag}".toString()
        ] + overrides).execute(null as String[], mpgDir)
        waitForAndCheckSuccess(process, "Mpg123 ./configure (${archFlag})")

        process = (["make", "clean"] + overrides).execute(null as String[], mpgDir)
        waitForAndCheckSuccess(process, "make clean (${archFlag})")

        process = (["make", "-j4", "src/libmpg123/libmpg123.la"] + overrides).execute(null as String[], mpgDir)
        waitForAndCheckSuccess(process, "make libmpg123 (${archFlag})")

        outDir.mkdirs()
        copy {
            from "$projectDir/mp3/mpg123-${mpg123Version}/src/libmpg123/.libs/libmpg123.a"
            into outDir
        }

        versionMarker.text = mpg123Version
    }
}

def prepareOggOnLinux(force) {
    def configured = file("$projectDir/vorbis/libogg-${oggVersion}/include/ogg/config_types.h").exists()

    if (force || !configured) {
        def buildArgs = Os.isFamily(Os.FAMILY_MAC) ? [] : ["--build=x86_64-pc-linux-gnu"]
        def process = (["sh", "./configure", "--enable-static"] + buildArgs + ["--with-pic"]).
            execute(null as String[], file("$projectDir/vorbis/libogg-${oggVersion}"))

        waitForAndCheckSuccess(process, "libogg ./configure")
    }
}

def prepareBuilds(force) {
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        generateMpg123ImportLibOnWindows("64", "win-x86-64", "x64")
        generateMpg123ImportLibOnWindows("32", "win-x86", "x86")
    } else if (Os.isFamily(Os.FAMILY_MAC)) {
        prepareOggOnLinux(force)
        buildMpg123MacSlice("x86_64", "x86_64-apple-darwin", "x86-64", "darwin-x86_64", force)
        buildMpg123MacSlice("arm64", "aarch64-apple-darwin", "aarch64", "darwin-arm64", force)
    } else {
        prepareOggOnLinux(force)
        buildMpg123OnLinux(force)
    }
}

tasks.register('compileNatives') {}
tasks.register('checkNatives') {}

def cmakeVersionArguments = [
    "-DOPUS_VERSION=${opusVersion}".toString(),
    "-DVORBIS_VERSION=${vorbisVersion}".toString(),
    "-DOGG_VERSION=${oggVersion}".toString(),
    "-DMPG123_VERSION=${mpg123Version}".toString(),
    "-DSAMPLERATE_VERSION=${sampleRateVersion}".toString(),
    "-DFDK_AAC_VERSION=${fdkAacVersion}".toString()
]

if (Os.isFamily(Os.FAMILY_MAC)) {
    def macScratchDeploy = file("${layout.buildDirectory.get()}/mac-slices")
    def libsX64Dir = file("$projectDir/libs/darwin-x86_64").absolutePath
    def libsArm64Dir = file("$projectDir/libs/darwin-arm64").absolutePath

    createBuildTask(tasks, [
        buildBase      : layout.buildDirectory.get(),
        projectBase    : projectDir,
        deployBase     : macScratchDeploy,
        setupDependency: tasks.named('load'),
        setupDoFirst   : { config -> prepareBuilds(false) },
        compileTask    : tasks.named('compileNatives'),
        checkTask      : tasks.named('checkNatives'),
        taskBase       : 'connector-darwin-x86-64',
        parameters     : [
            'identifier'    : 'darwin-x86_64',
            'library'       : 'libconnector.dylib',
            'setupArguments': ['-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_OSX_ARCHITECTURES=x86_64'],
            'buildArguments': ['--parallel', '4'],
            'env'           : [:]
        ],
        cmakeArguments : cmakeVersionArguments + ["-DMPG123_LIB_DIR=${libsX64Dir}".toString()],
        name           : 'connector'
    ])

    createBuildTask(tasks, [
        buildBase      : layout.buildDirectory.get(),
        projectBase    : projectDir,
        deployBase     : macScratchDeploy,
        setupDependency: tasks.named('connector-darwin-x86-64-deploy'),
        compileTask    : tasks.named('compileNatives'),
        checkTask      : tasks.named('checkNatives'),
        taskBase       : 'connector-darwin-arm64',
        parameters     : [
            'identifier'    : 'darwin-arm64',
            'library'       : 'libconnector.dylib',
            'setupArguments': ['-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_OSX_ARCHITECTURES=arm64'],
            'buildArguments': ['--parallel', '4'],
            'env'           : [:]
        ],
        cmakeArguments : cmakeVersionArguments + ["-DMPG123_LIB_DIR=${libsArm64Dir}".toString()],
        name           : 'connector'
    ])

    def universalTask = tasks.register('connector-darwin-universal', Exec) {
        dependsOn tasks.named('connector-darwin-x86-64-deploy'), tasks.named('connector-darwin-arm64-deploy')
        def outDir = file("${project(':natives-publish').projectDir}/src/main/resources/natives/darwin")
        doFirst {
            outDir.mkdirs()
        }
        executable 'lipo'
        args '-create',
            "${projectDir}/dist/darwin-x86_64/libconnector.dylib",
            "${projectDir}/dist/darwin-arm64/libconnector.dylib",
            '-output',
            "${outDir.absolutePath}/libconnector.dylib"
    }

    tasks.named('compileNatives').configure {
        dependsOn universalTask
    }
} else {
    def buildTaskConfig = [
        buildBase      : layout.buildDirectory.get(),
        projectBase    : projectDir,
        deployBase     : project(':natives-publish').projectDir,
        setupDependency: tasks.named('load'),
        setupDoFirst   : { config -> prepareBuilds(false) },
        compileTask    : tasks.named('compileNatives'),
        checkTask      : tasks.named('checkNatives'),
        cmakeArguments : cmakeVersionArguments,
        name           : 'connector'
    ]

    createBuildTask(tasks, buildTaskConfig)
}

if (Os.isFamily(Os.FAMILY_WINDOWS)) {
    def libs32Dir = file("$projectDir/libs/32").absolutePath.replace('\\', '/')
    def win32TaskConfig = [
        buildBase      : layout.buildDirectory.get(),
