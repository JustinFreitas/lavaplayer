        deployBase     : project(':natives-publish').projectDir,
        setupDependency: tasks.named('connector-64-setup'),
        compileTask    : tasks.named('compileNatives'),
        checkTask      : tasks.named('checkNatives'),
        taskBase       : 'connector-32',
        parameters     : [
            'identifier'    : 'win-x86',
            'library'       : 'connector.dll',
            'setupArguments': ['-DCMAKE_BUILD_TYPE=Release', '-A', 'Win32'],
            'buildArguments': ['--config', 'Release'],
            'env'           : [:]
        ],
        cmakeArguments : cmakeVersionArguments + ["-DMPG123_LIB_DIR=${libs32Dir}".toString()],
        name           : 'connector'
    ]
    createBuildTask(tasks, win32TaskConfig)
}
