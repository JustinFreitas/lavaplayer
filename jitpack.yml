jdk:
  - openjdk21
before_install:
  - git config --global --add safe.directory '*' || true
  - rm -rf ~/.m2/settings.xml ~/.gradle/init.gradle ~/.gradle/init.d || true
  - sdk install java 25.0.2-open || true
  - sdk use java 25.0.2-open || true
install:
  - ./gradlew clean build publishToMavenLocal -x test
